name: fact-check

services:
  postgres:
    image: postgres:16-alpine
    container_name: fact-check-postgres
    restart: unless-stopped
    env_file:
      - postgres.local.env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - fact_check_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  fact_check_postgres_data:
